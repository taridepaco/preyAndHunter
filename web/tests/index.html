<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prey · pruebas del motor</title>
  <style>
    :root { color-scheme: dark; --bg: #05070a; --panel: #10161d; --line: #243040; --ink: #e6edf3; --muted: #8b98a7; --ok: #5dcaa5; --bad: #ff7b72; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header strong { color: #ffb454; font-size: 16px; }
    #summary { color: var(--muted); font: 12px ui-monospace, Consolas, monospace; }
    main { max-width: 900px; padding: 8px 16px 32px; }
    p { color: var(--muted); }
    ol { padding-left: 1.4em; }
    li { margin: 4px 0; }
    li.ok::marker { color: var(--ok); }
    li.bad::marker { color: var(--bad); }
    .ms { color: var(--muted); font: 12px ui-monospace, Consolas, monospace; }
    .err { display: block; color: var(--bad); font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header><strong>Prey · pruebas del motor</strong><span id="summary">Ejecutando…</span></header>
  <main>
    <p>Cada escenario se ejecuta en la GPU (WebGPU) y en el motor de referencia de la CPU. Además de cumplir
      lo que se espera de él, la GPU tiene que coincidir bit a bit con la referencia: celdas, hierba y
      estadísticas de cada muestra.</p>
    <ol id="results"></ol>
  </main>
  <canvas id="gpu" width="16" height="16" hidden></canvas>
  <script type="module" src="tests.js"></script>
</body>
</html>
