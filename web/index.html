<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prey</title>
  <meta name="description" content="Ecosistemas vivos en la GPU: conejos, zorros y hierba en millones de celdas, y las ecuaciones de Lotka-Volterra descubiertas en directo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234f8a2b'/%3E%3Ccircle cx='5.5' cy='6' r='2.6' fill='%23eda100'/%3E%3Ccircle cx='10.5' cy='10' r='2.6' fill='%238f84ea'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <strong class="brand">Prey<small>ecosistemas en la GPU</small></strong>
    <div class="group">
      <button id="play" type="button" title="Reproducir / pausa (espacio)">▶ Play</button>
      <button id="step" type="button" title="Un tick (N)">Paso</button>
      <button id="reset" type="button" title="Volver a empezar con la misma semilla (R)">Reiniciar</button>
      <button id="fit" type="button" title="Ver el mundo entero (F)">Encajar</button>
    </div>
    <div class="group">
      <label>Mundo <select id="preset"></select></label>
      <label>Tamaño <select id="size"></select></label>
      <label>Velocidad <select id="speed"></select></label>
      <label>Semilla <input id="seed" type="number" min="0" step="1"></label>
      <button id="new-seed" type="button" title="Semilla nueva (S)">Nueva</button>
    </div>
    <div id="stats" class="stats" aria-live="off"></div>
  </header>

  <div class="app">
    <main class="stage">
      <canvas id="world"></canvas>
      <p class="hint">Clic: pincel · Arrastre con botón derecho, central o Mayús: mover · Rueda: zoom</p>
      <div id="error" class="error" hidden></div>
    </main>

    <aside class="side">
      <section>
        <h2 id="world-name">Mundo</h2>
        <p id="world-desc" class="desc"></p>
      </section>

      <section>
        <h2>Especies <span class="note">· los cambios se aplican en vivo</span></h2>
        <div id="species" class="cards"></div>
      </section>

      <section>
        <h2>Pincel</h2>
        <div id="tools" class="tools" role="group" aria-label="Herramienta del pincel"></div>
        <label class="brush-size">Radio <input id="brush-radius" type="range" min="1" max="64" step="1" value="12"><output id="brush-radius-out">12</output></label>
      </section>

      <section>
        <h2>Observatorio <span id="obs-note" class="note"></span></h2>
        <div id="series-wrap" class="chart"><canvas id="series" role="img" aria-label="Poblaciones a lo largo del tiempo"></canvas></div>
        <div id="phase-wrap" class="chart"><canvas id="phase" role="img" aria-label="Retrato de fase: presas frente a depredadores"></canvas></div>
        <div id="phase-legend" class="legend"></div>
        <div id="model-tabs" class="tabs" role="tablist"></div>
        <div id="model" class="model" role="tabpanel"></div>
      </section>
    </aside>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
